<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Building Survey Configuration Wizard" />
    <title>channels | Survey Builder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@300;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- apply saved theme and language before React loads, so the page doesn't flash -->
    <script>
      try {
        const prefs = JSON.parse(localStorage.getItem("channels-prefs") || "{}").state || {}
        const dark = prefs.theme === "dark"
        document.documentElement.classList.toggle("dark", dark)
        if (prefs.lang === "ar") {
          document.documentElement.lang = "ar"
          document.documentElement.dir = "rtl"
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
